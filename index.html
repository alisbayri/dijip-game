function unlockedAchievements() {
  return ACHIEVEMENTS.filter(a => a.check(state.player));
}
function checkNewAchievements() {
  const have = state.player.achievements || [];
  const now = unlockedAchievements().map(a => a.id);
  const fresh = now.filter(id => !have.includes(id));
  state.player.achievements = now;
  return fresh.map(id => ACHIEVEMENTS.find(a => a.id === id));
}

}

// ============== AUTH + SYNC ==============
const TOKEN_KEY = 'dijip_token';
function getToken() { try { return localStorage.getItem(TOKEN_KEY); } catch { return null; } }
function setToken(t) { try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch {} }

async function api(method, path, body, token = getToken()) {
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['Authorization'] = `Bearer ${token}`;
  const res = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Bir hata oluştu');
  return data;
}

let saveTimer = null;
function saveGame() {
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    if (!state.authUser) return;
    try { await api('POST', '/api/state', state.player); }
    catch (e) { console.warn('save failed', e); }
  }, 800);
}
async function loadGame() {
  if (!getToken()) return false;
  try {
    const me = await api('GET', '/api/me');
    state.authUser = me.user;
    const r = await api('GET', '/api/state');
    if (r.state) state.player = { ...state.player, ...r.state };
    state.player.name = state.authUser.name;
    state.screen = 'dashboard';
    return true;
  } catch (e) {
    setToken(null);
    state.authUser = null;
    return false;
  }
}

const XP_THRESHOLDS = [0, 200, 500, 900, 1400, 2000];
function levelFromXP(xp) {
  for (let i = XP_THRESHOLDS.length - 1; i >= 0; i--) if (xp >= XP_THRESHOLDS[i]) return i + 1;
  return 1;
}
function xpToNext(xp) {
  const lvl = levelFromXP(xp);
  const next = XP_THRESHOLDS[lvl] ?? XP_THRESHOLDS[XP_THRESHOLDS.length - 1];
  const prev = XP_THRESHOLDS[lvl - 1] ?? 0;
  return { current: xp - prev, needed: next - prev, pct: Math.min(100, ((xp - prev) / (next - prev)) * 100) };
}

// ============== SIMULATION ==============

function similarityScore(actual, ideal, type) {
  if (type === 'audience' || type === 'creative') return actual === ideal ? 100 : 35;
  if (type === 'channels') {
    let diff = 0;
    Object.keys(ideal).forEach(k => { diff += Math.abs((actual[k] || 0) - (ideal[k] || 0)); });
    return Math.max(0, 100 - diff * 0.6);
  }
  return 0;
}

function runSimulation(brief, decisions, miniGameBonusPct = 0, marketEvent = null) {
  let audScore = similarityScore(decisions.audience, brief.ideal.audience, 'audience');
  let chScore  = similarityScore(decisions.channels, brief.ideal.channels, 'channels');
  let crScore  = similarityScore(decisions.creative, brief.ideal.creative, 'creative');

  const staff = state.player.staff || [];
  const channelBonuses = {};
  let creativeBonus = 0;
  let dataBonus = 0;
  staff.forEach(id => {
    const s = STAFF[id]; if (!s) return;
    if (s.bonusChannel) {
      const allocation = (decisions.channels[s.bonusChannel] || 0) / 100;
      if (allocation > 0) channelBonuses[s.bonusChannel] = (channelBonuses[s.bonusChannel] || 0) + s.bonus * allocation;
    } else if (s.bonusType === 'creative') creativeBonus += s.bonus;
    else if (s.bonusType === 'data') dataBonus += s.bonus;
  });
  const channelBonusTotal = Object.values(channelBonuses).reduce((a,b)=>a+b,0);
  chScore = Math.min(100, chScore + channelBonusTotal);
  crScore = Math.min(100, crScore + creativeBonus);

  const overallRaw = (audScore * 0.35 + chScore * 0.4 + crScore * 0.25);
  const eventMod = marketEvent ? marketEvent.modifier : 0;
  const overall = Math.max(0, Math.min(100, overallRaw + miniGameBonusPct + dataBonus * 0.3 + eventMod));

  const randRange = dataBonus > 0 ? 0.5 : 1;
  const rand = (a, b) => a + Math.random() * (b - a) * randRange;
  const factor = overall / 100;

  const ctr = +(0.8 + factor * 6.5 + rand(-0.3, 0.5)).toFixed(2);
  const cvr = +(0.5 + factor * 5.5 + rand(-0.2, 0.4)).toFixed(2);
  const traffic = Math.round((brief.budget / 4) * (0.6 + factor * 1.4));
  const conversions = Math.round(traffic * (cvr / 100));
  const avgValue = brief.id === 'saascrm' ? 0 : (brief.id === 'butikotel' ? 4200 : 250 + factor * 200);
  const revenue = brief.id === 'saascrm'
    ? Math.round(conversions * 1500)
    : Math.round(conversions * avgValue);
  const roas = +(revenue / brief.budget).toFixed(2);
  const roi  = +(((revenue - brief.budget) / brief.budget) * 100).toFixed(1);
  const score = Math.round(overall);
  const stars = score >= 85 ? 3 : score >= 65 ? 2 : score >= 40 ? 1 : 0;

  const moneyEarned = Math.round(brief.rewards.baseMoney * (0.3 + factor * 1.2));
  const xpEarned = Math.round(brief.rewards.xp * (0.4 + factor * 1.0));
  const repDelta = stars === 3 ? +2 : stars === 2 ? +1 : stars === 1 ? 0 : -1;

  const feedback = [];
  if (decisions.audience !== brief.ideal.audience) {
    feedback.push({
      type: 'warn', area: 'Hedef Kitle',
      title: `Seçtin: ${AUDIENCES[decisions.audience].name}`,
      message: `İdeal: ${AUDIENCES[brief.ideal.audience].name}. ${brief.feedbackHints.audience}`
    });
  } else {
    feedback.push({ type: 'ok', area: 'Hedef Kitle', title: 'Tam isabet', message: 'Kitle seçimi brief\'le birebir örtüştü.' });
  }
  const chDiff = Object.keys(brief.ideal.channels).reduce((s, k) => s + Math.abs((decisions.channels[k] || 0) - brief.ideal.channels[k]), 0);
  if (chDiff > 30) {
    feedback.push({
      type: 'warn', area: 'Kanal Dağılımı',
      title: `Bütçe dağılımı ideal değil`,
      message: `${brief.feedbackHints.channels} İdeal dağılım: ${Object.entries(brief.ideal.channels).filter(([k,v])=>v>0).map(([k,v])=>`${CHANNELS[k].name.split(' ')[0]} %${v}`).join(', ')}.`
    });
  } else {
    feedback.push({ type: 'ok', area: 'Kanal Dağılımı', title: 'İyi denge', message: 'Bütçeyi doğru kanallara dağıttın.' });
  }
  if (decisions.creative !== brief.ideal.creative) {
    feedback.push({
      type: 'warn', area: 'Kreatif Yaklaşım',
      title: `Seçtin: ${CREATIVES[decisions.creative].name}`,
      message: `İdeal: ${CREATIVES[brief.ideal.creative].name}. ${brief.feedbackHints.creative}`
    });
  } else {
    feedback.push({ type: 'ok', area: 'Kreatif Yaklaşım', title: 'Doğru ton', message: 'Mesaj tonu hedef kitleyle uyumlu.' });
  }

  const salaryCost = totalSalary();
  const netMoneyEarned = Math.max(0, moneyEarned - salaryCost);

  return {
    metrics: { ctr, cvr, traffic, conversions, revenue, roas, roi },
    score, stars,
    moneyEarned: netMoneyEarned, grossMoney: moneyEarned, salaryCost,
    xpEarned, repDelta,
    feedback,
    staffContribution: { channelBonuses, creativeBonus, dataBonus, hired: [...staff] },
    marketEvent,
    scores: { audience: Math.round(audScore), channels: Math.round(chScore), creative: Math.round(crScore) }
  };
}

function fireConfetti() {
  const colors = ['#06b6d4', '#8b5cf6', '#f59e0b', '#10b981', '#ec4899', '#fbbf24'];
  for (let i = 0; i < 80; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.style.left = Math.random() * 100 + 'vw';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.animationDelay = Math.random() * 0.6 + 's';
    el.style.animationDuration = (2.5 + Math.random() * 1.5) + 's';
    el.style.transform = `rotate(${Math.random() * 360}deg)`;
    if (Math.random() > 0.5) el.style.borderRadius = '50%';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 4500);
  }
}

function animateCounters() {
  const els = document.querySelectorAll('[data-counter]');
  els.forEach(el => {
    const target = parseFloat(el.dataset.counter);
    const decimals = parseInt(el.dataset.decimals || '0');
    const suffix = el.dataset.suffix || '';
    const prefix = el.dataset.prefix || '';
    if (isNaN(target)) return;
    const duration = 1100;
    const start = performance.now();
    const startValue = 0;
    function step(now) {
      const elapsed = now - start;
      const t = Math.min(1, elapsed / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      const value = startValue + (target - startValue) * eased;
      const formatted = decimals === 0 ? Math.round(value).toLocaleString('tr-TR') : value.toFixed(decimals);
      el.textContent = `${prefix}${formatted}${suffix}`;
      if (t < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}

function renderWizard() {
  const steps = ['Hedef Kitle', 'Kanal Dağılımı', 'Kreatif Yaklaşım', 'Onay'];
  const b = state.currentBrief;
  const step = state.wizardStep;

  let content = '';
  if (step === 0) content = renderAudienceStep();
  else if (step === 1) content = renderChannelStep();
  else if (step === 2) content = renderCreativeStep();
  else if (step === 3) content = renderReviewStep();

  return `
    <div class="max-w-5xl mx-auto px-5 lg:px-8 py-8 lg:py-10">
      <div class="flex items-center justify-between mb-2 fade-in">
        <div>
          <div class="text-xs text-slate-400">${b.icon} ${b.client}</div>
          <h2 class="text-2xl lg:text-3xl font-bold">Kampanya Stratejisi</h2>
        </div>
        <button class="btn-ghost text-sm" data-action="back">← Vazgeç</button>
      </div>

      <div class="flex items-center gap-2 mb-6 fade-in">
        ${steps.map((s, i) => `
          <div class="flex-1">
            <div class="h-1 rounded-full ${i <= step ? 'bg-gradient-to-r from-cyan-400 to-purple-500' : 'bg-white/10'}"></div>
            <div class="text-xs mt-1.5 ${i === step ? 'text-white font-semibold' : 'text-slate-500'}">${s}</div>
          </div>
        `).join('')}
      </div>

      <div class="fade-in">${content}</div>

      <div class="flex gap-3 mt-8">
        ${step > 0 ? `<button class="btn-ghost" data-action="wiz-prev">← Geri</button>` : ''}
        <div class="flex-1"></div>
        <button class="btn-primary" data-action="wiz-next" id="wiz-next-btn">
          ${step < 3 ? 'Devam →' : '🚀 Kampanyayı Yayınla'}
        </button>
      </div>
    </div>
  `;
}

function renderAudienceStep() {
  const sel = state.decisions.audience;
  return `
    <div>
      <h3 class="text-xl lg:text-2xl font-bold mb-2">Hedef kitleyi kim olsun?</h3>

      </div>
    </div>
  `;
}

  const ch = state.decisions.channels;
  const total = Object.values(ch).reduce((a, b) => a + b, 0);
  const budget = state.currentBrief.budget;
  return `
    <div>
      <h3 class="text-xl font-bold mb-2">Bütçeyi kanallara böl</h3>

      <div class="grid lg:grid-cols-2 gap-3 mb-3">
        ${Object.values(CHANNELS).map(c => `
          <div class="glass p-4">
            <div class="flex items-start justify-between mb-3">

function renderReport() {
  const p = state.player;
  const history = p.history;
  if (history.length === 0) {
    return `
      <div class="max-w-2xl mx-auto px-5 py-12 text-center">
        <div class="text-6xl mb-4">📊</div>

        <button class="btn-primary" data-action="back-dashboard">Brief Kutusuna Dön</button>
      </div>
    `;
  }

  const avgScore = Math.round(history.reduce((s, h) => s + h.score, 0) / history.length);
  const totalRev = history.reduce((s, h) => s + h.metrics.revenue, 0);
  const totalSpend = history.reduce((s, h) => s + h.spend, 0);
  const overallROI = totalSpend > 0 ? +(((totalRev - totalSpend) / totalSpend) * 100).toFixed(1) : 0;
  const avgAudScore = Math.round(history.reduce((s, h) => s + h.scores.audience, 0) / history.length);
  const avgChScore = Math.round(history.reduce((s, h) => s + h.scores.channels, 0) / history.length);
  const avgCrScore = Math.round(history.reduce((s, h) => s + h.scores.creative, 0) / history.length);

  const strengths = [];
  const weaknesses = [];
  if (avgAudScore >= 75) strengths.push('Hedef kitle seçiminde tutarlı isabet');
  else if (avgAudScore < 50) weaknesses.push('Hedef kitle seçimi — brief\'i daha dikkatli oku, "kim alır?" sorusunu sor');
  if (avgChScore >= 75) strengths.push('Bütçe dağılımında dengeli yaklaşım');
  else if (avgChScore < 50) weaknesses.push('Kanal seçimi — niyet (Google) vs keşif (Meta) ayrımını netleştir');
  if (avgCrScore >= 75) strengths.push('Kreatif ton ile hedef kitle eşleşmesi güçlü');
  else if (avgCrScore < 50) weaknesses.push('Kreatif yaklaşım — B2B özellik, B2C duygu/sosyal kanıt');

  return `
    <div class="max-w-6xl mx-auto px-5 lg:px-8 py-8 lg:py-10 fade-in">
      <button class="btn-ghost mb-6" data-action="back-dashboard">← Brief Kutusu</button>

      <div class="text-center mb-8">
        <div class="text-6xl lg:text-7xl mb-3">📊</div>
        <h2 class="text-4xl lg:text-5xl font-black gradient-text">Performans Raporu</h2>
        <p class="text-slate-400 mt-2">${p.name} · Seviye ${levelFromXP(p.xp)} · ${history.length} kampanya</p>
      </div>

      <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
        <div class="metric-card text-center">
          <div class="text-xs text-slate-400 mb-1">ORTALAMA SKOR</div>
          <div class="text-2xl font-black gradient-text" data-counter="${avgScore}" data-suffix="/100">0/100</div>
        </div>
        <div class="metric-card text-center">
          <div class="text-xs text-slate-400 mb-1">TOPLAM GELİR</div>
          <div class="text-2xl font-black text-emerald-400" data-counter="${totalRev}" data-prefix="₺">₺0</div>
        </div>
        <div class="metric-card text-center">
          <div class="text-xs text-slate-400 mb-1">GENEL ROI</div>
          <div class="text-2xl font-black ${overallROI >= 0 ? 'text-emerald-400' : 'text-rose-400'}" data-counter="${overallROI}" data-suffix="%" data-prefix="${overallROI >= 0 ? '+' : ''}" data-decimals="1">0%</div>
        </div>
        <div class="metric-card text-center">
          <div class="text-xs text-slate-400 mb-1">İTİBAR</div>
          <div class="text-2xl font-black text-amber-400" data-counter="${p.reputation}">0</div>
        </div>
      </div>

      <div class="grid lg:grid-cols-2 gap-4 mb-6">
        <div class="glass-strong p-5">
          <h3 class="font-bold mb-3 text-emerald-400">💪 Güçlü Yönlerin</h3>
          ${strengths.length ? strengths.map(s => `<div class="text-sm mb-2">✅ ${s}</div>`).join('') : '<div class="text-sm text-slate-400">Daha fazla kampanya tamamla.</div>'}
        </div>
        <div class="glass-strong p-5">
          <h3 class="font-bold mb-3 text-amber-400">🎯 Gelişim Alanları</h3>
          ${weaknesses.length ? weaknesses.map(w => `<div class="text-sm mb-2">💡 ${w}</div>`).join('') : '<div class="text-sm text-slate-400">Açıkça zayıf alan yok — istikrarlı performans!</div>'}
        </div>
      </div>

      <div class="grid lg:grid-cols-2 gap-4">
        <div class="glass-strong p-5">
          <h3 class="font-bold mb-4">📈 Karar Yetkinliği Ortalaması</h3>
          ${[
            ['Hedef Kitle', avgAudScore],
            ['Kanal Dağılımı', avgChScore],
            ['Kreatif', avgCrScore]
          ].map(([n, v]) => `
            <div class="mb-3">
              <div class="flex justify-between text-sm mb-1"><span>${n}</span><span class="font-bold">${v}/100</span></div>
              <div class="progress-track"><div class="progress-fill" style="width: ${v}%"></div></div>
            </div>
          `).join('')}
        </div>

        <div class="glass-strong p-5">
          <h3 class="font-bold mb-3">📋 Kampanya Geçmişi</h3>
        ${history.map(h => `
          <div class="flex items-center justify-between py-2 border-b border-white/5 last:border-0">
            <div class="flex items-center gap-3">
              <div class="text-2xl">${h.icon}</div>
              <div>
                <div class="font-semibold text-sm">${h.client}</div>
                <div class="text-xs text-slate-400">${'★'.repeat(h.stars)}${'☆'.repeat(3-h.stars)}</div>
              </div>
            </div>
            <div class="text-right">
              <div class="font-bold text-sm">${h.score}/100</div>
              <div class="text-xs text-slate-400">ROI ${h.metrics.roi}%</div>
            </div>
          </div>
        `).join('')}
        </div>
      </div>
    </div>
  `;
}

// ============== EVENTS ==============

function attachListeners() {
  const startBtn = document.getElementById('start-btn');
  if (startBtn) {
    const input = document.getElementById('name-input');
    input?.focus();
    const handleStart = () => {
      const name = (input.value || '').trim();
      if (!name) { input.focus(); return; }
      state.player.name = name;
      state.screen = 'dashboard';
      saveGame();
      render();
    };
    startBtn.addEventListener('click', handleStart);
    input?.addEventListener('keydown', e => { if (e.key === 'Enter') handleStart(); });
  }

  document.querySelectorAll('[data-action]').forEach(el => {
    el.addEventListener('click', e => {
      const action = el.dataset.action;
      const id = el.dataset.id;
      handleAction(action, id, el);
    });
  });

  document.querySelectorAll('input[type="range"][data-channel]').forEach(el => {
    el.addEventListener('input', e => {
      const ch = el.dataset.channel;
      state.decisions.channels[ch] = parseInt(el.value);
      render();
    });
  });
}

async function handleAction(action, id, el) {
  switch (action) {
    case 'open-brief':
      state.currentBrief = BRIEFS.find(b => b.id === id);
      state.screen = 'brief';
      render();
      break;
    case 'back':
      state.screen = 'dashboard';
      state.currentBrief = null;
      render();
      break;
    case 'back-dashboard':
      if (state.player.completedBriefs.length >= BRIEFS.length && state.screen === 'results' && !state.player.victorySeen) {
        state.player.victorySeen = true;
        saveGame();
        state.screen = 'victory';
        state.currentBrief = null;
        state.lastResult = null;
        render();
        setTimeout(fireConfetti, 300);
        setTimeout(fireConfetti, 1800);
        return;
      }
      state.screen = 'dashboard';
      state.currentBrief = null;
      state.lastResult = null;
      state.decisions = { audience: null, channels: { google: 25, meta: 25, email: 25, seo: 25 }, creative: null };
      state.wizardStep = 0;
      state.miniGamePicked = [];
      state.miniGameResult = null;
      render();
      break;
    case 'start-wizard':
      state.wizardStep = 0;
      state.decisions = { audience: null, channels: { google: 25, meta: 25, email: 25, seo: 25 }, creative: null };
      state.screen = 'wizard';
      render();
      break;
    case 'select-audience':
      state.decisions.audience = id;
      render();
      break;
    case 'select-creative':
      state.decisions.creative = id;
      render();
      break;
    case 'normalize': {
      const total = Object.values(state.decisions.channels).reduce((a,b) => a+b, 0);
      if (total > 0) {
        Object.keys(state.decisions.channels).forEach(k => {
          state.decisions.channels[k] = Math.round((state.decisions.channels[k] / total) * 100 / 5) * 5;
        });
        const newTotal = Object.values(state.decisions.channels).reduce((a,b)=>a+b,0);
        if (newTotal !== 100) {
          const diff = 100 - newTotal;
          const maxKey = Object.keys(state.decisions.channels).reduce((a,b) => state.decisions.channels[a] > state.decisions.channels[b] ? a : b);
          state.decisions.channels[maxKey] += diff;
        }
      } else {
        state.decisions.channels = { google: 25, meta: 25, email: 25, seo: 25 };
      }
      render();
      break;
    }
    case 'wiz-prev':
      state.wizardStep = Math.max(0, state.wizardStep - 1);
      render();
      break;
    case 'wiz-next': {
      const s = state.wizardStep;
      if (s === 0 && !state.decisions.audience) { toast('Hedef kitle seç'); return; }
      if (s === 1) {
        const total = Object.values(state.decisions.channels).reduce((a,b)=>a+b,0);
        if (total !== 100) { toast(`Bütçe %${total} — %100\'e ulaşmalı`); return; }
      }
      if (s === 2 && !state.decisions.creative) { toast('Kreatif yaklaşım seç'); return; }
      if (s < 3) { state.wizardStep++; render(); }
      else goToMiniGameOrLaunch();
      break;
    }
    case 'toggle-mg': {
      const idx = parseInt(el.dataset.idx);
      const mg = MINIGAMES[state.currentBrief.id];
      const picked = state.miniGamePicked;
      const pos = picked.indexOf(idx);
      if (pos >= 0) picked.splice(pos, 1);
      else if (picked.length < mg.pick) picked.push(idx);
      else if (mg.pick === 1) { picked.length = 0; picked.push(idx); }
      render();
      break;
    }
    case 'confirm-mg': {
      const mg = MINIGAMES[state.currentBrief.id];
      if (state.miniGamePicked.length !== mg.pick) return;
      const score = miniGameScore(state.miniGamePicked, mg);
      state.miniGameResult = {
        score,
        picks: state.miniGamePicked.map(i => mg.options[i]),
        config: mg
      };
      launchCampaign();
      break;
    }
    case 'skip-mg':
      state.miniGameResult = null;
      launchCampaign();
      break;
    case 'report':
      state.screen = 'report';
      render();
      break;
    case 'reset':
      resetGame();
      break;
    case 'agency':
      state.screen = 'agency';
      render();
      break;
    case 'hire': {
      const s = STAFF[id];
      if (!s) return;
      if (state.player.money < s.hireCost) { toast('Yeterli paran yok'); return; }
      if (hasStaff(id)) return;
      state.player.money -= s.hireCost;
      state.player.staff = [...(state.player.staff || []), id];
      saveGame();
      toast(`${s.icon} ${s.name} ekibe katıldı!`);
      render();
      break;
    }
    case 'fire': {
      const s = STAFF[id];
      if (!s) return;
      if (!confirm(`${s.name} işten çıkarılacak. Devam?`)) return;
      state.player.staff = (state.player.staff || []).filter(x => x !== id);
      saveGame();
      toast(`${s.name} ayrıldı`);
      render();
      break;
    }
    case 'tutorial-next':
      if (state.tutorialStep < TUTORIAL_STEPS.length - 1) {
        state.tutorialStep++;
        render();
      } else {
        state.player.tutorialDone = true;
        state.tutorialStep = 0;
        saveGame();
        render();
      }
      break;
    case 'tutorial-prev':
      if (state.tutorialStep > 0) { state.tutorialStep--; render(); }
      break;
    case 'tutorial-skip':
      state.player.tutorialDone = true;
      saveGame();
      render();
      break;
    case 'auth-tab':
      state.authTab = el.dataset.tab;
      state.authError = '';
      render();
      break;
    case 'login': {
      const email = document.getElementById('auth-email')?.value?.trim();
      const password = document.getElementById('auth-password')?.value;
      if (!email || !password) { state.authError = 'E-posta ve şifre gerekli'; render(); return; }
      state.authLoading = true; state.authError = ''; render();
      try {
        const r = await api('POST', '/api/login', { email, password });
        setToken(r.token);
        state.authUser = r.user;
        const st = await api('GET', '/api/state');
        if (st.state) state.player = { ...state.player, ...st.state };
        state.player.name = r.user.name;
        state.screen = 'dashboard';
        state.authLoading = false;
        render();
      } catch (e) {
        state.authLoading = false;
        state.authError = e.message;
        render();
      }
      break;
    }
    case 'register': {
      const name = document.getElementById('auth-name')?.value?.trim();
      const email = document.getElementById('auth-email')?.value?.trim();
      const password = document.getElementById('auth-password')?.value;
      if (!name || !email || !password) { state.authError = 'Tüm alanları doldur'; render(); return; }
      state.authLoading = true; state.authError = ''; render();
      try {
        const r = await api('POST', '/api/register', { name, email, password });
        setToken(r.token);
        state.authUser = r.user;
        state.player.name = r.user.name;
        state.screen = 'dashboard';
        state.authLoading = false;
        saveGame();
        render();
      } catch (e) {
        state.authLoading = false;
        state.authError = e.message;
        render();
      }
      break;
    }
    case 'logout':
      if (confirm('Çıkış yapmak istediğinden emin misin?')) logout();
      break;
    case 'leaderboard':
    case 'leaderboard-public':
      state.screen = 'leaderboard';
      state.leaderboard = null;
      render();
      try {
        const r = await api('GET', '/api/leaderboard', null, null);
        state.leaderboard = r.leaderboard;
        render();
      } catch {
        state.leaderboard = [];
        render();
      }
      break;
    case 'back-auth':
      state.screen = 'auth';
      render();
      break;
  }
}

function goToMiniGameOrLaunch() {
  if (MINIGAMES[state.currentBrief.id]) {
    state.miniGamePicked = [];
    state.miniGameResult = null;
    state.screen = 'minigame';
    render();
  } else {
    launchCampaign();
  }
}

function launchCampaign() {
  state.screen = 'simulating';
  render();
  const messages = ['Reklamlar görüntüleniyor...', 'Hedef kitle yakalanıyor...', 'Tıklamalar geliyor...', 'Dönüşümler hesaplanıyor...', 'Sonuçlar derleniyor...'];
  let i = 0;
  const interval = setInterval(() => {
    const el = document.getElementById('sim-status');
    if (el) el.textContent = messages[i % messages.length];
    i++;
  }, 600);

  const marketEvent = rollMarketEvent();
  if (marketEvent) {
    setTimeout(() => {
      const el = document.getElementById('sim-status');
      if (el) el.innerHTML = `<span class="${marketEvent.tone === 'good' ? 'text-emerald-300' : 'text-rose-300'}">${marketEvent.icon} ${marketEvent.title}</span>`;
    }, 1500);
  }

  setTimeout(() => {
    clearInterval(interval);
    const mgBonus = state.miniGameResult ? (state.miniGameResult.score - 50) * 0.3 : 0;
    const result = runSimulation(state.currentBrief, state.decisions, mgBonus, marketEvent);
    result.miniGame = state.miniGameResult;
    state.lastResult = result;
    state.player.money += result.moneyEarned;
    state.player.xp += result.xpEarned;
    state.player.reputation += result.repDelta;
    state.player.completedBriefs.push(state.currentBrief.id);
    state.player.history.push({
      id: state.currentBrief.id,
      client: state.currentBrief.client,
      icon: state.currentBrief.icon,
      score: result.score,
      stars: result.stars,
      metrics: result.metrics,
      scores: result.scores,
      miniScore: state.miniGameResult?.score || 0,
      spend: state.currentBrief.budget,
      date: new Date().toISOString()
    });
    const newAch = checkNewAchievements();
    state.lastResult.newAchievements = newAch;
    state.screen = 'results';
    saveGame();
    render();
    if (result.stars === 3) setTimeout(fireConfetti, 400);
    if (newAch.length) setTimeout(() => newAch.forEach((a, i) => setTimeout(() => toast(`🏆 ${a.icon} Yeni Rozet: ${a.name}`), i * 700)), 800);
  }, 3000);
}

function toast(msg) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2500);
}

// ============== INIT ==============
(async () => {
  const loaded = await loadGame();
  if (!loaded) state.screen = 'auth';
  render();
})();
</script>
